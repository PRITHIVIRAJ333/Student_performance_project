<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Student Performance Predictor</h1>

    <p>Enter your academic details</p>

    <form action="/predict" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Student Name"
            required
        >

        <input
            type="number"
            name="study_hours"
            placeholder="Study Hours per Day"
            step="0.1"
            min="0"
            max="24"
            required
        >

        <input
            type="number"
            name="attendance"
            placeholder="Attendance (%)"
            min="0"
            max="100"
            required
        >

        <input
            type="number"
            name="previous_marks"
            placeholder="Previous Marks (%)"
            min="0"
            max="100"
            required
        >

        <input
            type="number"
            name="internal_marks"
            placeholder="Internal Marks (%)"
            min="0"
            max="100"
            required
        >

        <input
            type="number"
            name="assignment_score"
            placeholder="Assignment Score (%)"
            min="0"
            max="100"
            required
        >

        <input
            type="number"
            name="sleep_hours"
            placeholder="Sleep Hours"
            step="0.1"
            min="0"
            max="24"
            required
        >

        <label>Extracurricular Activity</label>

        <select name="extracurricular">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <button type="submit">
            Predict Performance
        </button>

    </form>

</div>

</body>
</html>
