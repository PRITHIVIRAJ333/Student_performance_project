<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Predict Performance | EduPredict</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>


<nav class="navbar">

    <div class="logo">
        Edu<span>Predict</span>
    </div>

    <div class="nav-links">

        <a href="/">Home</a>

        <a href="/predictor">
            Predict
        </a>

    </div>

</nav>


<div class="form-container">

    <div class="form-header">

        <div class="badge">
            📊 Student Analysis
        </div>

        <h1>
            Predict Your Performance
        </h1>

        <p>
            Enter your academic and lifestyle details
            to get your predicted score.
        </p>

    </div>


    <form action="/predict"
          method="POST"
          class="prediction-form">


        <!-- Student Name -->

        <div class="form-group">

            <label>Student Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

        </div>


        <!-- Study Hours -->

        <div class="form-group">

            <label>Study Hours Per Day</label>

            <input
                type="number"
                name="study_hours"
                placeholder="Example: 5"
                min="0"
                max="24"
                step="0.1"
                required
            >

        </div>


        <!-- Attendance -->

        <div class="form-group">

            <label>Attendance (%)</label>

            <input
                type="number"
                name="attendance"
                placeholder="Example: 80"
                min="0"
                max="100"
                step="0.1"
                required
            >

        </div>


        <!-- Previous Marks -->

        <div class="form-group">

            <label>Previous Marks (%)</label>

            <input
                type="number"
                name="previous_marks"
                placeholder="Example: 75"
                min="0"
                max="100"
                step="0.1"
                required
            >

        </div>


        <!-- Internal Marks -->

        <div class="form-group">

            <label>Internal Marks (%)</label>

            <input
                type="number"
                name="internal_marks"
                placeholder="Example: 70"
                min="0"
                max="100"
                step="0.1"
                required
            >

        </div>


        <!-- Assignment -->

        <div class="form-group">

            <label>Assignment Score (%)</label>

            <input
                type="number"
                name="assignment_score"
                placeholder="Example: 80"
                min="0"
                max="100"
                step="0.1"
                required
            >

        </div>


        <!-- Sleep -->

        <div class="form-group">

            <label>Sleep Hours Per Day</label>

            <input
                type="number"
                name="sleep_hours"
                placeholder="Example: 7"
                min="0"
                max="24"
                step="0.1"
                required
            >

        </div>


        <!-- Extracurricular -->

        <div class="form-group">

            <label>
                Extracurricular Activities
            </label>

            <select name="extracurricular">

                <option value="0">
                    No
                </option>

                <option value="1">
                    Yes
                </option>

            </select>

        </div>


        <button
            type="submit"
            class="primary-btn full-btn">

            🔮 Predict Performance

        </button>


    </form>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
